name: Publish to MCP Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [server.json]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish server.json
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz
          ./mcp-publisher login github-oidc
          set +e
          OUT=$(./mcp-publisher publish 2>&1); CODE=$?
          echo "$OUT"
          [ $CODE -eq 0 ] && exit 0
          echo "$OUT" | grep -q "duplicate version" && { echo "already published — OK"; exit 0; }
          exit $CODE
